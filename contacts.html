<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Kris</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; text-align: center; }
        h1 { color: #3498db; }
        .contact-info { margin-top: 30px; font-size: 1.1em; }
        .social-links a { margin: 0 15px; color: #2c3e50; text-decoration: none; font-weight: bold; }
        .contact-form { max-width: 500px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; text-align: left; }
        .contact-form label, .contact-form input, .contact-form textarea { display: block; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>

    <nav style="background-color: #2c3e50; padding: 15px;">
        <a href="index.html" style="color: white; margin: 0 15px; text-decoration: none;">Home</a>
        <a href="about.html" style="color: white; margin: 0 15px; text-decoration: none;">About Me</a>
        </nav>

    <h1>Get In Touch</h1>

    <section class="contact-info">
        <h2>Direct Contact</h2>
        <p>Email: kristopher.angeles@gmail.com</p>
        
        <h2>Connect Online</h2>
        <div class="social-links">
            <a href="#" target="_blank">LinkedIn</a> |
            <a href="#" target="_blank">GitHub</a> |
            <a href="#" target="_blank">Twitter/X</a>
        </div>
    </section>
    
    <section class="contact-form">
        <h2>Send a Message (Optional)</h2>
        <form action="#" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit" style="background-color: #3498db; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">Send Message</button>
        </form>
    </section>

</body>
</html>
